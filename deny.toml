# cargo-deny configuration (GH #46). Run locally with `cargo deny check`.
#
# Four checks, all wired into CI (.github/workflows/ci.yml):
#   advisories - RUSTSEC vulnerability / unmaintained / yanked scanning.
#     There was no advisory scanning at all before this on a dependency
#     tree that includes several image codecs (jpeg/png/webp) parsing
#     attacker-supplied bytes - exactly the class of crate RUSTSEC most
#     often has entries for.
#   licenses   - fails the build on a copyleft/unlisted license landing
#     transitively.
#   bans       - duplicate-version and explicitly-banned-crate checks.
#   sources    - only allow crates.io as a registry source.

[advisories]

db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436 (`paste` unmaintained). This entry has now been added,
    # removed and added again, so the history is worth keeping straight:
    # it was originally ignored for rav1e; #67/#68 deleted it when libavif-sys
    # replaced ravif/rav1e and `paste` left the graph; the C-dependency removal took out the C
    # codecs and brought ravif/rav1e back, and `avif-decode` -> `rav1d` reaches
    # it too, so it is in the graph twice over:
    #   cargo tree --all-features -i paste
    #     paste v1.0.15 (proc-macro)
    #     |-- rav1d v1.1.0  <- avif-decode
    #     `-- rav1e v0.8.1  <- ravif
    # `paste` is a proc-macro with no runtime component and the advisory is
    # "unmaintained", not a vulnerability. Nothing here can act on it until
    # both upstreams drop it.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2026-0258/0098/0099/0104 (h2 empty DATA frames; rustls-webpki
    # name-constraint and CRL-panic issues) were previously ignored here: GH #56
    # found `aws-sdk-s3`'s own `default` feature set pulled in BOTH TLS stacks
    # at once - `default-https-client` (the modern hyper-1/rustls-0.23/h2-0.4
    # connector actually used at runtime under BehaviorVersion::latest()) AND
    # `rustls` (a misleadingly-named feature that in fact wires up the
    # *legacy* hyper-0.14/rustls-0.21.12/rustls-webpki-0.101.7/h2-0.3.27
    # connector - unused dead code at runtime here, but still present in the
    # resolved dependency graph `cargo deny` scans). Dropping the `rustls`
    # feature from the `aws-sdk-s3` dependency in Cargo.toml (default-features
    # = false + explicit feature list) removed the legacy stack from the
    # graph entirely - no upstream release was needed. See GH #56.
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",

    # webpki-root-certs, reached via reqwest 0.13 -> rustls-platform-verifier.
    # CDLA-Permissive-2.0 is the Community Data License Agreement's permissive
    # variant, which is what Mozilla's CA root bundle is published under — a
    # data licence, no copyleft, no notice obligation.
    # Arrived with the reqwest 0.12 -> 0.13 bump (#103). Already on the
    # allow-list in the sibling vaam-apps/vsms for the same crate and the same
    # reason, so this matches an existing org decision rather than making a
    # new one.
    "CDLA-Permissive-2.0",

    # NOTE: "IJG" is deliberately NOT a blanket allow any more (C-dependency removal). It used
    # to be, for mozjpeg-sys. Removing mozjpeg did NOT remove the licence:
    # `jpeg-encoder`, the pure-Rust replacement, is ALSO "(MIT OR Apache-2.0)
    # AND IJG" - its default quantisation and Huffman tables come from the IJG
    # reference implementation. Rewriting a codec in Rust does not relicense
    # the tables it was derived from, and this was caught only because
    # cargo-deny failed the build; it is not visible from the crate's name or
    # its README.
    #
    # So the obligation stands unchanged: distributed documentation must state
    # that the software is "based in part on the work of the Independent JPEG
    # Group". That notice is in NOTICE and README.md and must stay for as long
    # as the exception below exists. It is now a scoped exception rather than a
    # global allow, so a *different* crate arriving with IJG gets flagged
    # instead of being waved through.
]
confidence-threshold = 0.8

# Per-crate licence exceptions. Narrower than adding to `allow` above: these
# apply to exactly one crate each, so the same licence appearing on any other
# dependency still fails the check.
exceptions = [
    # See the IJG note in `allow` above - carries a documentation obligation
    # that is satisfied by NOTICE and README.md.
    { name = "jpeg-encoder", allow = ["IJG"] },

    # libfuzzer-sys is LLVM's libFuzzer binding (NCSA) and is a dev-dependency
    # of a transitive dependency's fuzz targets - `cargo tree -i libfuzzer-sys`
    # prints "nothing to print" for both `-e normal` and `-e normal,dev`, i.e.
    # cargo never builds it and it ships in nothing. cargo-deny still walks it
    # because its graph includes transitive dev-dependencies.
    #
    # Worth being explicit about, since it is a `-sys` crate that would compile
    # C++ if it were ever actually built: it is exempted here because it is
    # unreachable, not because a C++ dependency is acceptable. The
    # `no-native-deps` CI job checks the real build graph and would catch it if
    # that ever changed.
    { name = "libfuzzer-sys", allow = ["NCSA"] },
]

# NOTE: the `[[licenses.clarify]]` entry for `ring` was removed with the C dependencies.
# `ring` left the graph with aws-lc-rs/rustls's default provider, replaced by
# the pure-Rust `rustls-graviola`; `cargo tree -i ring` finds nothing under any
# feature set. Deleted rather than left as dead config, matching how the
# RUSTSEC-2024-0436 entry above was handled the first time round.

[bans]
multiple-versions = "warn"
# The `gen-server` path dependency that originally forced this is gone (#53
# deleted the OpenAPI codegen), and `publish = false` now sits in Cargo.toml,
# so `allow-wildcard-paths` applies properly. Kept at "warn" rather than
# tightened to "deny" in the same change that removed the cause - flip it to
# "deny" once a CI run confirms nothing else trips it.
wildcards = "warn"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# `unknown-git = "deny"` above means any git dependency must be named here.
# vaam-image-webp (C-dependency removal) is this org's fork of image-rs/image-webp, carried
# only because no *published* crate encodes lossy WebP in pure Rust - upstream
# has the encoder on `main` but has not released it. Cargo.toml pins it by
# `rev`, so this allowance does not let arbitrary upstream commits in.
#
# This is meant to be temporary: when upstream releases lossy encoding, the
# dependency should go back to crates.io and this entry should be deleted.
allow-git = ["https://github.com/vaam-apps/vaam-image-webp"]
