name: CI

# GH #46: build.yml only builds/pushes Docker images and lint-codebase.yml
# only runs super-linter - neither ran `cargo test` or a real `cargo
# clippy`. This workflow adds the missing test/lint/audit/benchmark gates.
#
# GH #45 / #53: `gen-server` used to be a path dependency generated from
# openapi.yaml by `make init` (which needed Docker) and, before that, was
# gitignored - so a fresh clone (and every job here) failed with "failed to
# get `gen-server` as a dependency" before running a single test. #53
# removed the codegen entirely: the HTTP router is hand-written now
# (src/modules/api, src/modules/router, src/modules/url), so no job needs
# Docker or `make init` at all any more.

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # One job per feature set. Previously this ran `local_fs` only, which
    # meant the `s3` feature's entire test suite never ran in CI at all -
    # that is how a completely non-starting `s3` image (GLIBC_2.38 against a
    # Debian 12 runtime) reached a release build unnoticed. `otel` was worse
    # than untested: it gates `/metrics`, so the auth added in GH #77 had no
    # CI coverage whatsoever on the endpoint it protects.
    #
    # `--no-default-features` is deliberate. `default = []` today, so it is
    # currently a no-op, but without it a future non-empty default would
    # silently pull `local_fs` into the `s3` job and stop these from being
    # the isolated feature sets they claim to be.
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features:
          - local_fs
          - s3
          - local_fs,otel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # zizmor[artipacked]: checkout persists the token in
          # .git/config by default. No job in this workflow pushes
          # with git, so it is pure exposure.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-${{ matrix.features }}

      - name: cargo test --no-default-features --features ${{ matrix.features }}
        run: |
          cargo test --no-default-features \
            --features ${{ matrix.features }} --all-targets

  clippy:
    name: Clippy (non-blocking - TODO GH #46)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # zizmor[artipacked]: checkout persists the token in
          # .git/config by default. No job in this workflow pushes
          # with git, so it is pure exposure.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: clippy-local_fs

      # TODO(#46): drop `continue-on-error` once the existing warning
      # backlog is cleared and make this a required check. As of this
      # writing `cargo clippy --features local_fs --all-targets` reports
      # ~20 pre-existing warnings across src/ (dead_code,
      # collapsible_if, manual_saturating_arithmetic, unnecessary_closure,
      # doc-list-item indentation, a couple of module/method naming
      # lints - `interior_mutable_const`-style false positives not
      # among them). None of that is in the files this change owns, so
      # it isn't fixed here - see the PR description for the full list
      # from a local run. Left non-blocking rather than silently
      # allow-listing every lint away.
      - name: cargo clippy --features local_fs -- -D warnings
        continue-on-error: true
        run: cargo clippy --features local_fs --all-targets -- -D warnings

  helm-verify:
    # GH #84 / #85: nothing in CI ever rendered helm/emgr or
    # helm/serverless, which is exactly how both charts shipped without
    # the SIGNING_KEY/SIGNING_SALT/METRICS_AUTH_TOKEN env wiring (#84) and
    # helm/serverless shipped a doubled `ghcr.io/ghcr.io/...` image
    # reference, a literal `${LOG_LEVEL:-info}` value, and an unpublished
    # `latest` tag (#85). `helm lint`/`helm template` need no cluster and
    # run in well under a minute, so there's no excuse for this gap.
    name: Helm lint + template (both charts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # zizmor[artipacked]: checkout persists the token in
          # .git/config by default. No job in this workflow pushes
          # with git, so it is pure exposure.
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      # `helm dependency build` (not `update`) - both charts commit a
      # Chart.lock, so this resolves exactly the pinned `common` library
      # version rather than re-resolving against whatever is newest.
      # `helm dependency build` resolves `Chart.yaml`'s dependencies against
      # repositories the running machine already knows about. A developer's
      # laptop usually has them from earlier work, so this step passes
      # locally and fails on a clean runner with "no repository definition
      # for ...". Adding the repo explicitly is what makes the job
      # reproducible rather than dependent on ambient local state - which is
      # the entire point of adding it to CI.
      #
      # helm/serverless's `common` comes from an OCI registry, which needs no
      # `helm repo add`; only helm/emgr's bjw-s-labs repository does.
      - name: helm repo add
        run: |
          helm repo add bjw-s-labs https://bjw-s-labs.github.io/helm-charts
          helm repo update

      - name: helm dependency build
        run: |
          helm dependency build ./helm/emgr
          helm dependency build ./helm/serverless

      - name: helm lint
        run: |
          helm lint ./helm/emgr
          helm lint ./helm/serverless

      # Rendering is the actual regression gate here: #85's doubled
      # registry, unexpanded LOG_LEVEL, and #84's missing signing/metrics
      # env vars were all only visible in rendered output, never in the
      # source YAML alone (`helm lint` alone did not catch any of them).
      - name: helm template
        run: |
          helm template ./helm/emgr
          helm template ./helm/serverless

  cargo-deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # zizmor[artipacked]: checkout persists the token in
          # .git/config by default. No job in this workflow pushes
          # with git, so it is pure exposure.
          persist-credentials: false

      # Reads Cargo.lock directly - doesn't need `make init` or a build.
      #
      # This runs with `--all-features`, and that is deliberate. It used to be
      # accidental: no `arguments:` is set here, and cargo-deny-action defaults
      # `arguments` to `--all-features` (see its action.yml), so the comment
      # that used to sit here - claiming the opposite, that --all-features was
      # avoided on purpose - described behaviour this step has never had.
      #
      # Keep it. RUSTSEC-2026-0285 (rustls) is the proof: `rustls` enters this
      # graph ONLY through the `s3` feature's AWS SDK chain. `cargo tree -i
      # rustls` prints "nothing to print" for the default feature set and for
      # `local_fs` and `local_fs,otel`. Had the old comment's stated intent
      # ever been implemented, that advisory would have been invisible here.
      #
      # An advisory scan is not a build: seeing every feature's dependencies is
      # the point, not a false positive.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  no-native-deps:
    name: no C/C++ build dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # zizmor[artipacked]: checkout persists the token in
          # .git/config by default. No job in this workflow pushes
          # with git, so it is pure exposure.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # #134 took every C and C++ dependency out of this service: mozjpeg-sys
      # (libjpeg-turbo), libavif-sys/libaom-sys/libdav1d-sys, libwebp-sys,
      # libmimalloc-sys, zstd-sys and aws-lc-sys are all gone, replaced by
      # pure-Rust crates. Nothing in the build compiles C, assembles NASM, or
      # needs cmake or meson any more, which is why neither the Dockerfile nor
      # any job in this workflow installs a toolchain.
      #
      # That property is invisible in review and trivial to lose: one
      # transitive dependency flipping on a default feature is enough, and the
      # symptom would be a confusing linker or "nasm not found" failure in
      # whichever job happened to build first - or worse, no failure here at
      # all and a broken `docker build` later, since the runners and the image
      # are separate places that would each need the toolchain added back.
      # Fail loudly and specifically instead.
      #
      # Runs with --all-features on purpose, same reasoning as cargo-deny
      # above: aws-lc-sys enters only through the optional `s3` feature, so a
      # default-feature check would not see the single most likely regression.
      # Checked for BOTH targets, not just the runner's. This job originally
      # tested only the host and reported a clean graph while the x86_64 build
      # genuinely needed NASM - `avif-decode` declares rav1d twice, once per
      # target, and only the non-x86 table sets `default-features = false`, so
      # `asm` (and with it nasm-rs and cc) is enabled on x86_64 alone. A
      # host-only check on an arm64 runner or an Apple Silicon laptop passes
      # while `docker build --platform linux/amd64` fails on missing nasm.
      #
      # `-e all` rather than `-e build`: optional, feature-gated,
      # target-specific build-dependencies do not reliably show up under
      # `-e build`, which is the other half of how the same miss happened.
      # Checks the FEATURE, not the crate. That distinction is the whole
      # reason this job is shaped the way it is, and the obvious-looking
      # version of it does not work:
      #
      #   * `cc` and `nasm-rs` are in the graph unconditionally, because rav1d
      #     declares them as plain build-dependencies. But both are ordinary
      #     Rust crates that merely *drive* external tools, and rav1d's
      #     `build.rs` `main()` is entirely `#[cfg(feature = "asm")]` - with
      #     the feature off, neither is ever called. Failing on their presence
      #     would fail forever, on a build that needs no toolchain at all.
      #   * `cargo tree -e build` does NOT reliably surface optional,
      #     feature-gated, target-specific build-dependencies, so a forward
      #     build-edge scan can report a clean graph for a build that really
      #     does need NASM.
      #   * `cargo tree -i <crate>` exits 0 even when it prints "nothing to
      #     print", so testing its exit status finds everything, always.
      #
      # An earlier version of this job made all three mistakes at once and
      # passed while the amd64 image build was broken.
      #
      # Both targets are checked because this is exactly where it hid: the
      # avif-decode fork aside, upstream enables rav1d's asm on x86_64 only, so
      # a host-only check on an arm64 runner or an Apple Silicon laptop passes
      # while `docker build --platform linux/amd64` fails on missing nasm.
      - name: assert no assembly or native toolchain is required
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

          fail=0
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            echo "::group::$target"
            enabled=$(cargo tree --all-features -e features --target "$target" \
                        | grep -E 'feature "asm' | sort -u || true)
            if [ -n "$enabled" ]; then
              echo "::error::An assembly feature is enabled for $target - the build now needs an assembler and a C compiler."
              echo "$enabled"
              fail=1
            else
              echo "no asm features enabled"
            fi
            echo "::endgroup::"
          done

          # cmake/meson/bindgen have no such feature subtlety: if they are in
          # the graph at all, something is compiling native source.
          for crate in cmake bindgen; do
            out=$(cargo tree --all-features -e normal,build \
                    --target x86_64-unknown-linux-gnu -i "$crate" 2>/dev/null || true)
            if printf '%s' "$out" | grep -q "^$crate v"; then
              echo "::error::$crate is in the dependency graph - a dependency is building native source."
              printf '%s\n' "$out" | head -20
              fail=1
            fi
          done

          [ "$fail" -eq 0 ] || {
            echo "The build must need only rustc. See the Dockerfile's own note."
            exit 1
          }
          echo "OK: no assembly, no native toolchain."

      # Separate concern from the toolchain check: a crate can link a prebuilt
      # native library without compiling anything, which the feature scan above
      # would not notice.
      #
      # Allowlist rather than a blanket `-sys` ban - these bind libraries that
      # already exist on the target (macOS system frameworks, the Windows API,
      # raw Linux syscalls, wasm/JS glue) and compile no source of their own.
      - name: assert no native (-sys) libraries
        run: |
          set -euo pipefail
          cargo tree --all-features -e normal --target x86_64-unknown-linux-gnu \
            --prefix none --format '{p}' \
            | sed 's/ (\*)//' | sort -u > deps.txt

          if grep -iE '(-sys )|^(ring|aws-lc-rs) ' deps.txt \
              | grep -viE '^(core-foundation-sys|security-framework-sys|windows-sys|linux-raw-sys|wasi|js-sys|web-sys|jni-sys) '; then
            echo "::error::A dependency reintroduced a native library."
            exit 1
          fi
          echo "OK: no native libraries."

  docs-env-drift:
    name: Docs env-var drift check (GH #47)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # zizmor[artipacked]: checkout persists the token in
          # .git/config by default. No job in this workflow pushes
          # with git, so it is pure exposure.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: configuration.md must match env.rs exactly
        run: python3 .github/scripts/check_env_docs.py

  bench-baseline:
    name: Benchmarks (save main baseline)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # zizmor[artipacked]: checkout persists the token in
          # .git/config by default. No job in this workflow pushes
          # with git, so it is pure exposure.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: bench-local_fs

      # Same invocation captured in .bench-baseline/BASELINE.md, kept
      # deliberately low sample-size/measurement-time to keep CI runtime
      # reasonable (GH #20: "start loose ... tighten once the numbers are
      # stable"). `--save-baseline main` writes to
      # target/criterion/<bench>/main/, which the cache step below
      # persists for PR runs to restore and compare against.
      - name: cargo bench --features local_fs -- --save-baseline main
        run: |
          cargo bench --features local_fs -- \
            --sample-size 20 --measurement-time 2 --warm-up-time 1 \
            --save-baseline main

      # actions/cache keys are immutable, so this always writes a new,
      # unique key (per-commit) rather than trying to overwrite one -
      # the PR-side `bench` job below finds it again via `restore-keys`
      # prefix matching, which resolves to the most recent entry.
      - name: Persist baseline for PR comparisons
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}

  bench:
    name: Benchmarks (regression gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # zizmor[artipacked]: checkout persists the token in
          # .git/config by default. No job in this workflow pushes
          # with git, so it is pure exposure.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: bench-local_fs

      # No `fail-on-cache-miss` - the very first PR after this workflow
      # lands (before any push to main has produced a baseline) simply
      # runs with no comparison; bench_gate.py treats that as "no
      # baseline" per benchmark rather than a failure.
      - name: Restore main baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}
          restore-keys: |
            criterion-baseline-main-

      # `--baseline-lenient`, not `--baseline`: plain `--baseline` makes
      # criterion hard-error when the named baseline is absent, which is
      # exactly the state of every PR until a push to main has saved one.
      # Lenient mode runs the benches and simply skips the comparison, which
      # is what bench_gate.py already expects to handle.
      - name: cargo bench --features local_fs -- --baseline-lenient main
        run: |
          cargo bench --features local_fs -- \
            --sample-size 20 --measurement-time 2 --warm-up-time 1 \
            --baseline-lenient main

      - name: Build regression report
        id: gate
        run: |
          set +e
          python3 .github/scripts/bench_gate.py --threshold 15 --output bench-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post/update PR comment with percentile table
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('bench-report.md', 'utf8');
            const marker = '<!-- bench-gate-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if any benchmark regressed past the threshold
        if: steps.gate.outputs.exit_code != '0'
        run: exit 1
